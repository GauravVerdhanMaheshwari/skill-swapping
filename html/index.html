<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>
    <div class="register">
        <div class="innerRegister">
            <form action="./home.html" method="post">
                <h1 class="heading">REGISTER</h1>
                <label for="name">User Name</label><br>
                <input type="text" name="userName" class="input" id="userName"
                    placeholder="Enter your username"><br><br>
                <label for="email">Email</label><br>
                <input type="email" name="email" class="input" id="email" placeholder="Enter your email"><br><br>
                <label for="password">Password</label><br>
                <input type="password" name="password" class="input" id="password"
                    placeholder="Enter your password"><br><br>
                <label for="password">Conform Password</label><br>
                <input type="password" name="conformPassword" class="input" id="conformPassword"
                    placeholder="Conform your password"><br><br>
                <input type="submit" value="Register" class="button"><br><br>
                <a href="login.html" class="link"> Already have an account</a>
            </form>
        </div>
    </div>
</body>

</html>
